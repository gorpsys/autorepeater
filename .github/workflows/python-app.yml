# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  offline-checks:
    name: Offline checks
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Set up Python 3.12
      uses: actions/setup-python@v3
      with:
        python-version: "3.12"
    - name: Check release version
      env:
        VERSION_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        VERSION_EVENT: ${{ github.event_name }}
      run: |
        if [ "$VERSION_EVENT" = "pull_request" ]; then
          python -m scripts.release_version check --base "$VERSION_BASE_SHA"
        else
          python -m scripts.release_version check --allow-existing
        fi
    - name: Install verified dependencies with SDK fallback
      run: |
        python -m pip install --upgrade pip
        make setup
    - name: Strict lint and types
      run: |
        make lint
    - name: Offline checks
      id: tests
      env:
        DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      run: make coverage
    - name: Network package smoke
      timeout-minutes: 20
      env:
        CLOUD_PACKAGE_SHA: ${{ github.sha }}
      run: make check-cloud-package
    - name: Upload coverage report
      if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
      uses: actions/upload-artifact@v4
      with:
        name: coverage
        path: coverage.xml
