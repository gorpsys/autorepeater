name: deploy-prod

on:
  workflow_run:
    workflows: [Sandbox live E2E]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions: {}

concurrency:
  group: deploy-prod
  cancel-in-progress: false
  queue: max

jobs:
  gate:
    if: >-
      github.repository == 'gorpsys/autorepeater' &&
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      checks: read
      statuses: read
    outputs:
      sha: ${{ steps.checks.outputs.sha }}
      ready: ${{ steps.checks.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require all checks for the exact current master commit
        id: checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m scripts.deploy_gate

  deploy:
    needs: [gate]
    if: ${{ needs.gate.outputs.ready == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      checks: read
      statuses: read
      id-token: write
    env:
      DEPLOY_SHA: ${{ needs.gate.outputs.sha }}
      FOLDER_ID: b1gdgrp5bnth11phova8
      CLOUD_ID: b1gbga988v36vq19lmb7
      SA_ID: ajela8pd8l3bjeupa04s
      GITHUB_OIDC_AUDIENCE: https://github.com/gorpsys
      FUNCTION_NAME: python-function
      FUNCTION_RUNTIME: python312
      FUNCTION_ENTRYPOINT: handler.handler
      FUNCTION_MEMORY: 256MB
      FUNCTION_TIMEOUT: 60s
      FUNCTION_SA_ID: ajelpbq7as5bpe499962
      BUCKET: autorepeater-deploy
      ZIP_PATH: ./build/yandex-function.zip
      LOCKBOX_SECRET_ID: e6qc2ghhip6925lllhm7
      LOCKBOX_VERSION_ID: e6qqshm7lkthgotpdqf6
      LOCKBOX_KEY: t_token
      LOCKBOX_ENVIRONMENT_VARIABLE: t_token
      YC_CLI_VERSION: 1.40.0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the existing cloud package
        run: make claude-yandex-archive
      - name: Install the pinned official yc binary
        timeout-minutes: 4
        run: |
          mkdir -p "$RUNNER_TEMP/yc-bin"
          curl --fail --silent --show-error --location \
            --connect-timeout 10 --max-time 120 --retry 2 --retry-max-time 180 \
            "https://storage.yandexcloud.net/yandexcloud-yc/release/${YC_CLI_VERSION}/linux/amd64/yc" \
            --output "$RUNNER_TEMP/yc-bin/yc"
          chmod +x "$RUNNER_TEMP/yc-bin/yc"
          echo "$RUNNER_TEMP/yc-bin" >> "$GITHUB_PATH"
      - name: Recheck master and required checks before cloud credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m scripts.deploy_gate --check-once
      - name: Exchange OIDC, publish ZIP and verify ACTIVE version
        run: python3 -m scripts.yandex_deploy
