name: Temporary CNY liquidity research

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  market-research:
    name: Read sandbox CNY market data
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Inspect public TLS chain without credentials
      run: |
        python - <<'PY'
        import json
        import ssl
        import subprocess
        print(json.dumps({'openssl': ssl.OPENSSL_VERSION,
                          'ca_counts': ssl.create_default_context().cert_store_stats()}), flush=True)
        for host in ('sandbox-invest-public-api.tbank.ru', 'pypi.org'):
            try:
                probe = subprocess.run([
                    'openssl', 's_client', '-connect', host + ':443', '-servername', host,
                    '-verify_return_error', '-verify_hostname', host, '-showcerts',
                ], input='', capture_output=True, text=True, timeout=18)
                facts = [line[:500] for line in (probe.stdout + probe.stderr).splitlines()
                         if line.strip().startswith(('depth=', 'verify error:',
                                                     'Verification error:', 'Verify return code:'))]
                print(json.dumps({'host': host, 'openssl_exit': probe.returncode,
                                  'verification': facts[:16]}), flush=True)
                certificate = subprocess.run([
                    'openssl', 'x509', '-noout', '-subject', '-issuer', '-dates',
                    '-fingerprint', '-sha256',
                ], input=probe.stdout, capture_output=True, text=True, timeout=5)
                if certificate.returncode == 0:
                    print(json.dumps({'host': host,
                                      'public_certificate_metadata':
                                      certificate.stdout.splitlines()[:8]}), flush=True)
            except subprocess.TimeoutExpired:
                print(json.dumps({'host': host, 'result': 'timeout'}), flush=True)
        PY
    - name: Inventory CNY settlement instruments
      env:
        SANDBOX_TOKEN: ${{ secrets.SANDBOX_TOKEN }}
      run: >-
        python scripts/research_cny_liquidity.py --phase inventory
        --output cny-research/inventory.json
    - name: Preserve initial inventory
      uses: actions/upload-artifact@v4
      with:
        name: cny-inventory-${{ github.run_id }}
        path: cny-research/inventory.json
        retention-days: 7
    - name: Screen trading permissions and five-level books
      timeout-minutes: 12
      env:
        SANDBOX_TOKEN: ${{ secrets.SANDBOX_TOKEN }}
      run: >-
        python scripts/research_cny_liquidity.py --phase screen
        --inventory cny-research/inventory.json --output cny-research/screen.json
    - name: Preserve screened candidates
      uses: actions/upload-artifact@v4
      with:
        name: cny-screen-${{ github.run_id }}
        path: cny-research/*.json
        retention-days: 7
    - name: Observe shortlist for fifteen minutes
      timeout-minutes: 18
      env:
        SANDBOX_TOKEN: ${{ secrets.SANDBOX_TOKEN }}
      run: >-
        python scripts/research_cny_liquidity.py --phase sample
        --inventory cny-research/screen.shortlist.json
        --output cny-research/observations.jsonl --seconds 900 --interval 10
    - name: Preserve all research data, including partial observations
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: cny-research-${{ github.run_id }}
        path: cny-research/
        retention-days: 7
