[tool.mypy]
python_version = "3.12"
files = [
    "scripts/make_environment.py",
    "scripts/make_offline.py",
    "scripts/build_yandex_archive.py",
    "scripts/vendor_inventory.py",
    "scripts/sdk_wheel.py",
    "scripts/sdk_worker.py",
    "scripts/runtime_lock.py",
    "scripts/update_runtime_lock.py",
    "scripts/install_dependencies.py",
    "scripts/package_wheels.py",
    "scripts/cloud_dependencies.py",
    "scripts/cloud_build_tls.py",
    "scripts/check_cloud_bundle.py",
    "scripts/sandbox_token.py",
    "scripts/sandbox_e2e.py",
    "scripts/sandbox_lifecycle.py",
    "scripts/sandbox_support.py",
    "scripts/sandbox_evidence.py",
    "scripts/sandbox_github.py",
    "scripts/sandbox_retry.py",
    "scripts/sandbox_retry_report.py",
    "scripts/retry_results.py",
    "scripts/retry_settings.py",
    "scripts/retry_evidence.py",
    "scripts/deploy_support.py",
    "scripts/deploy_gate.py",
    "scripts/release_version.py",
    "scripts/yandex_deploy.py",
    "autorepeater/tinvest_requests.py",
]
follow_imports = "silent"
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["e2e.retry_policy"]
follow_imports = "normal"

[[tool.mypy.overrides]]
module = ["t_tech.*", "grpc.*"]
ignore_missing_imports = true
