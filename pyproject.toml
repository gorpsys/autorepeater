[tool.mypy]
python_version = "3.12"
files = [
    "scripts/make_environment.py",
    "scripts/make_offline.py",
    "scripts/sandbox_token.py",
    "scripts/sandbox_e2e.py",
    "scripts/sandbox_lifecycle.py",
    "scripts/sandbox_support.py",
    "scripts/sandbox_evidence.py",
    "autorepeater/tinvest_requests.py",
]
follow_imports = "silent"
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["t_tech.*", "grpc.*"]
ignore_missing_imports = true
